<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Wallet</title>

body { margin:0; font-family:Arial; background:#f2f5f8; }

<header><h2>My Wallet</h2></header>
<div class="balance">
<p>Available Balance</p>
<h1>0.00 ETB</h1>
<p>Demo Wallet</p>
</div>
<div class="services">
<div class="item">💸 Send Money</div>

<div class="item">📊 Transactions</div>
</div>
</body>
</html>
